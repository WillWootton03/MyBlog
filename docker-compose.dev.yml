name: TheCookedDev

services:
  api:
    build: ./backend
    ports:
    - "8000:8000"
    volumes:
      - ./backend:/app
      - post_images:/app/uploaded_images
      - ${USERPROFILE}/.aws:/root/.aws:ro
    restart: on-failure
    env_file:
      - ./backend/.env
    environment:
    - WATCHFILES_FORCE_POLLING=true
  frontend:
    build: ./frontend
    ports:
    - "5173:5173" 
    environment:
    - CHOKIDAR_USEPOLLING=true
    env_file:
    - ./frontend/.env
    volumes:
    - ./frontend:/app
    - /app/node_modules
    depends_on:
    - api
    restart: unless-stopped


volumes:
  post_images: