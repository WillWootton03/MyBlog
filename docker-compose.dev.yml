name: TheCookedDev

services:
  api:
    build: ./backend
    ports:
    - "8000:8000"
    volumes:
      - sqlite_data:/data
    env_file:
      - ./backend/.env
  frontend:
    build: ./frontend
    ports:
    - "5173:5173" 
    environment:
    - CHOKIDAR_USEPOLLING=true
    env_file:
    - ./frontend/.env
    volumes:
    - ./frontend:/app
    - /app/node_modules
    depends_on:
    - api
    restart: unless-stopped


volumes:
  sqlite_data: